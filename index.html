<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a12" />
  <title>Farmapp</title>

  <style>
    :root{
      --bg:#07150f;
      --card:#0f241a;
      --text:#e9fff5;
      --muted:#9fc7b6;
      --line:#1f3f30;

      --accent:#18c46c;
      --accent2:#0ea85a;
      --danger:#ff5c5c;

      --radius:18px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    body{
      margin:0;
      color:var(--text);
      background:radial-gradient(1200px 800px at 30% 0%, #0b2519 0%, var(--bg) 55%);
    }

    /* Layout */
    .app{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    header{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:saturate(1.1) blur(6px);
      background:linear-gradient(180deg, rgba(7,21,15,.92), rgba(7,21,15,.72));
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      padding:12px 12px 10px 12px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .brand .t{
      font-weight:900;
      letter-spacing:.2px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand .s{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pill{
      font-size:12px;
      color:rgba(233,255,245,.92);
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.22);
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .main{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:12px;
      padding:12px;
      align-items:start;
    }

    /* Mobile: nav on top */
    @media (max-width: 920px){
      .main{ grid-template-columns: 1fr; }
      nav#nav{
        position:sticky;
        top:64px;
        z-index:40;
      }
    }

    /* NAV: tett, ikke gjennomsiktig */
    nav#nav{
      border-radius:var(--radius);
      background: #0b1b13; /* helt tett */
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding:10px;
      display:grid;
      gap:8px;
    }

    /* Buttons */
    .btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10); /* ikke “glass” */
      color:inherit;
      cursor:pointer;
      font-weight:700;
    }
    .btn:hover{ background: rgba(255,255,255,.14);
