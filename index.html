<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a12" />
  <title>Farmapp</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#07150f;color:#e9fff5}
    .wrap{padding:14px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px}
    .muted{color:#9fc7b6;font-size:12px;line-height:1.35}
    pre{white-space:pre-wrap;word-break:break-word;background:#0b1b13;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:12px;color:#e9fff5}
    .ok{color:#18c46c;font-weight:900}
    .bad{color:#ff5c5c;font-weight:900}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-weight:900;font-size:18px">Farmapp – feilsøk</div>
      <div class="muted">Hvis appen krasjer, vises feilen under.</div>
      <div id="status" class="muted" style="margin-top:10px">Starter…</div>
      <div id="errbox" style="margin-top:12px; display:none;">
        <div class="bad">Feil</div>
        <pre id="err"></pre>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const errBox = document.getElementById("errbox");
    const errEl = document.getElementById("err");

    function showErr(msg){
      errEl.textContent = String(msg || "Ukjent feil");
      errBox.style.display = "block";
      statusEl.innerHTML = '<span class="bad">Krasjet.</span>';
    }

    window.addEventListener("error", (e) => {
      showErr((e?.message || "JS error") + "\n\n" + (e?.filename || "") + ":" + (e?.lineno || "") + ":" + (e?.colno || ""));
    });

    window.addEventListener("unhandledrejection", (e) => {
      const r = e?.reason;
      showErr("Unhandled promise rejection:\n\n" + (r?.stack || r?.message || String(r)));
    });
  </script>

  <script type="module">
    const statusEl = document.getElementById("status");
    const showErr = (msg) => {
      document.getElementById("err").textContent = String(msg || "Ukjent feil");
      document.getElementById("errbox").style.display = "block";
      statusEl.innerHTML = '<span class="bad">Krasjet.</span>';
    };

    try{
      statusEl.innerHTML = '<span class="muted">Laster modules/app.js…</span>';
      const mod = await import("./modules/app.js?v=" + Date.now()); // cache-bust
      if (!mod || typeof mod.boot !== "function") {
        throw new Error("Fant ikke boot() i modules/app.js");
      }
      statusEl.innerHTML = '<span class="ok">app.js lastet. Kjører boot()…</span>';
      await mod.boot();
      statusEl.innerHTML = '<span class="ok">boot() kjørt. Hvis du fortsatt ser bare denne siden, feiler UI/DOM-id’er.</span>';
    }catch(e){
      showErr(e?.stack || e?.message || String(e));
    }
  </script>
</body>
</html>
